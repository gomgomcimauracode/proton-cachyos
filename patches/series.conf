# name | tier | required | target | fuzz | source
#
# tier     : stable < performance < aggressive. Seçilen profil, kendi tier'ı ve altındakileri uygular.
# required : yes = uygulanamazsa derleme durur, no = atlanır (strict açıksa o da durdurur)
# target   : kaynak ağacında yamanın uygulanacağı klasör (wine, dxvk, vkd3d-proton ...)
# fuzz     : patch --fuzz değeri (yüksek değer yanlış yere oturma riskini artırır)
# source   : opts:<yol>  -> deadlock-linux-optimizations reposu içinden
#            local:<yol> -> bu reponun içinden (ör. local:patches/wine/benim.patch)
#            url:<adres> -> doğrudan indirilen patch dosyası
#
# SIRA ÖNEMLİDİR: yamalar yukarıdan aşağıya uygulanır.

0002-ntdll-sync-fast-paths | performance | yes | wine | 3 | opts:patches/wine/0002-ntdll-sync-fast-paths.patch
0003-socket-shm-polling    | performance | yes | wine | 2 | opts:patches/wine/0003-socket-shm-polling.patch

