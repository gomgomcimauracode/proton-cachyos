# patches/series.conf
#
# Format (6 alan, '|' ile ayrilir; isimde, yolda veya URL'de '|' kullanma):
#   name | tier | required | target | fuzz | source
#
#   tier     stable < performance < aggressive. Secilen profil kendi tier'ini ve altini uygular.
#   required yes = uygulanamazsa build durur. no = atlanir ve raporda gorunur.
#            (strict_patches=true ile 'no' olanlar da build'i durdurur.)
#   target   yamanin uygulanacagi klasor (kaynak agacina gore). '.' = Proton kok dizini.
#   fuzz     patch --fuzz degeri. Yuksek fuzz yamayi yanlis yere oturtabilir, senkronizasyon
#            kodunda bu kilitlenme demektir. Gerekmedikce 2'nin ustune cikma.
#   source   opts:<yol>  -> deadlock-linux-optimizations reposu icinden
#            local:<yol> -> bu repodan (ornek: local:patches/wine/benim.patch)
#            url:<adres> -> dogrudan indirilen .patch dosyasi
#
# SIRA ONEMLIDIR. Yamalar yukaridan asagiya uygulanir. Deadlock yamalari birbirinin
# ustune yazildigi ve olculdugu icin 0001 -> 0002 -> 0003 sirasi korunmali.
#
# NOT: Deadlock yamalari GE-Proton11-11 tabani icin yazilmis ve olculmus. CachyOS tabaninda
# uygulanmayabilir. Uygulanamayan yama build'i bozmasin diye 'required' hepsinde 'no'.
# Bir yamanin her build'de zorunlu olmasini istiyorsan 'yes' yap.

# ---------------------------------------------------------------------------
# STABLE: dis yama yok. Sadece CachyOS'un kendi icerigi.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# PERFORMANCE: kucuk, kapsamli ve olcumle desteklenen degisiklikler
# ---------------------------------------------------------------------------

# QueryPerformanceCounter'i rdtscp yerine rdtsc ile okur.
# Zaman damgalari farkli thread'lerde ~300 ns sirasiz cikabilir. Bu kisim sadece
# WINE_QPC_TSC_UNORDERED=1 ile acilir (build'e degil, oyun baslatma secenegine yazilir).
# Yama ayrica clocksource dosyasini acik tutar, bu kisim her zaman aktiftir.
0001-ntdll-qpc-rdtsc        | performance | no | wine | 2 | opts:patches/wine/0001-ntdll-qpc-rdtsc.patch

# Anonim event/semaphore'lari yeniden kullanir, SRW kilitleri ve WaitOnAddress icin
# hizli yollar ekler. Yazarin olcumune gore en buyuk kazanci bu yama sagliyor.
# Bu yama CachyOS tabaninda 2 hunk'ta reddedildi (satir ~679 ve ~890). 0001 ile sirali
# denenmeden sonuc kesin degil.
0002-ntdll-sync-fast-paths  | performance | no | wine | 2 | opts:patches/wine/0002-ntdll-sync-fast-paths.patch

# ---------------------------------------------------------------------------
# AGGRESSIVE: wineserver protokolunu degistirenler veya az denenmis olanlar
# ---------------------------------------------------------------------------

# Soket olay durumunu wineserver paylasilan belleginde tutar. FPS'i degistirmiyor,
# wineserver CPU yukunu ve paket isleme gecikmesini dusuruyor. Protokol degistigi icin
# wineserver ve ntdll.so birlikte yeniden uretilmeli (script make_requests'i kendisi calistirir).
0003-socket-shm-polling     | aggressive  | no | wine | 2 | opts:patches/wine/0003-socket-shm-polling.patch

# Her kare yapilan Steam callback yoklamasinda ortam degiskeni taramasini ve Unix cagrisini
# atlar. Proton kok dizinine uygulanir. GE'nin lsteamclient yamalarindan sonra yazildigi
# icin CachyOS'ta uygulanamayabilir.
0004-lsteamclient-env-skip  | aggressive  | no | .    | 2 | opts:patches/lsteamclient/0001-skip-env-sync-on-callback-polling.patch

# ---------------------------------------------------------------------------
# SABLON: yeni yama eklemek icin bir satirin basindaki '#' isaretini kaldir
# ---------------------------------------------------------------------------
# 0100-yama-adi             | aggressive  | no | wine | 2 | local:patches/wine/yama-adi.patch
# 0101-baska-yama           | aggressive  | no | wine | 2 | url:https://example.com/yol/yama.patch
