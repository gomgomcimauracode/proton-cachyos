name: Build Proton-CachyOS-Deadlock (AIO)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source branch to build (empty = newest cachyos_*_*/main)'
        required: false
        default: ''
      profile:
        description: 'Patch profile'
        type: choice
        options: [stable, performance, aggressive]
        default: performance
      strict_patches:
        description: 'Fail on ANY patch failure (not only required ones)'
        type: boolean
        default: false
      optimize_haswell:
        description: 'Replace -march=nocona with -march=haswell'
        type: boolean
        default: true
      opts_ref:
        description: 'deadlock-linux-optimizations ref (branch/tag/commit)'
        required: false
        default: 'main'
  push:
    branches:
      - cachyos_main

concurrency:
  group: proton-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FALLBACK_REF: cachyos_11.0_20261014/main
  BUILD_NAME: cachyos-deadlock
  DEBIAN_FRONTEND: noninteractive
  GIT_TERMINAL_PROMPT: '0'
  PROFILE: ${{ inputs.profile || 'performance' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      # ---------- 0. Tooling (scripts + patch manifest) from the workflow's own branch ----------
      - name: Checkout CI tooling
        uses: actions/checkout@v4
        with:
          path: ci
          fetch-depth: 1

      - name: Resolve source branch
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            latest=$(git ls-remote --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              | awk '{print $2}' | sed 's,^refs/heads/,,' \
              | grep -E '^cachyos_[0-9.]+_[0-9]+/main$' | sort -V | tail -n1 || true)
            ref="${latest:-$FALLBACK_REF}"
          fi
          echo "==> Building source branch: $ref (profile: $PROFILE)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # ---------- 1. Runner preparation ----------
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/julia* /usr/share/miniconda /opt/microsoft /usr/local/share/powershell
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          mkdir -p ~/.ccache ~/.cache/ccache

          if sudo swapoff -a && sudo fallocate -l 8G /mnt/proton.swap \
             && sudo chmod 600 /mnt/proton.swap && sudo mkswap /mnt/proton.swap >/dev/null \
             && sudo swapon /mnt/proton.swap; then
            echo "==> Swap enabled"
          else
            echo "::warning::Could not enable swap; link steps may hit OOM"
          fi

          avail=$(df --output=avail -BG / | tail -n1 | tr -dc '0-9')
          echo "==> Free space on /: ${avail}G"
          [ "$avail" -lt 40 ] && echo "::warning::Less than 40G free; the build may run out of disk"
          free -h

      # ---------- 2. Sources ----------
      - name: Checkout Proton source (submodules included)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout optimization patches
        uses: actions/checkout@v4
        with:
          repository: itchyfeetleech/deadlock-linux-optimizations
          ref: ${{ inputs.opts_ref || 'main' }}
          path: opts
          fetch-depth: 1

      - name: Verify source tree
        working-directory: src
        run: |
          echo "==> HEAD: $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"
          [ -f configure.sh ] && chmod +x configure.sh
          if [ ! -x ./configure.sh ] || [ ! -f ./Makefile ]; then
            echo "::error::configure.sh or Makefile not found. Is '${{ steps.ref.outputs.ref }}' a source branch?"
            ls -la
            exit 1
          fi
          if git submodule status --recursive | grep -q '^-'; then
            echo "::error::Uninitialized submodules:"
            git submodule status --recursive | grep '^-'
            exit 1
          fi
          docker --version

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # ---------- 3. Patch series ----------
      - name: Apply patch series
        env:
          SRC_DIR: ${{ github.workspace }}/src
          CI_DIR: ${{ github.workspace }}/ci
          OPTS_DIR: ${{ github.workspace }}/opts
          STRICT: ${{ inputs.strict_patches || 'false' }}
        run: bash ci/scripts/apply-patches.sh

      # ---------- 4. Configure ----------
      - name: Configure Proton build
        working-directory: src
        run: |
          mkdir -p "build/$BUILD_NAME"
          cd "build/$BUILD_NAME"
          for attempt in 1 2 3; do
            if ../../configure.sh --build-name="$BUILD_NAME" --enable-ccache; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::configure.sh failed after 3 attempts"; exit 1
            fi
            echo "==> configure.sh failed (attempt $attempt), retrying in 20s"
            sleep 20
          done
          [ -f Makefile ] || { echo "::error::No Makefile generated"; ls -la; exit 1; }

      - name: Tune optimization flags
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.optimize_haswell }}
        working-directory: src/build/cachyos-deadlock
        run: |
          grep -n -- '-march=' Makefile || true
          if grep -q -- '-march=nocona' Makefile; then
            sed -i 's/-march=nocona/-march=haswell/g' Makefile
            echo "==> -march=nocona -> -march=haswell"
          else
            echo "::warning::-march=nocona not found in Makefile; flags unchanged."
          fi

      # ---------- 5. Build ----------
      - name: Build Proton
        id: build
        timeout-minutes: 330
        working-directory: src/build/cachyos-deadlock
        run: |
          target=""
          for t in redist dist; do
            if make -n "$t" >/dev/null 2>&1; then target="$t"; break; fi
          done
          if [ -z "$target" ]; then
            echo "::error::Neither 'redist' nor 'dist' target exists. Available targets:"
            make -pRrq : 2>/dev/null | awk -F: '/^[a-zA-Z0-9][^$#\/\t=]*:([^=]|$)/ {print $1}' | sort -u | head -50 || true
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "==> Building '$target' with $(nproc) jobs"
          make -j"$(nproc)" "$target" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Fix ownership and ccache stats
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          du -sh ~/.ccache ~/.cache/ccache 2>/dev/null || echo "==> No ccache dir found"

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      # ---------- 6. Package ----------
      - name: Package compatibility tool
        id: pack
        working-directory: src/build/cachyos-deadlock
        run: |
          target="${{ steps.build.outputs.target }}"
          vdf=$(find "./$target" -maxdepth 3 -name compatibilitytool.vdf 2>/dev/null | head -n1 || true)
          [ -z "$vdf" ] && vdf=$(find . -maxdepth 4 -name compatibilitytool.vdf 2>/dev/null | sort | head -n1 || true)
          if [ -z "$vdf" ]; then
            echo "::error::compatibilitytool.vdf not found"; ls -la; exit 1
          fi
          dist_dir=$(dirname "$vdf")

          # Smoke checks on the output layout
          [ -f "$dist_dir/proton" ] || { echo "::error::'proton' launcher missing in $dist_dir"; exit 1; }
          [ -d "$dist_dir/files" ] || echo "::warning::'files/' directory missing in $dist_dir"

          src_sha=$(git -C "$GITHUB_WORKSPACE/src" rev-parse --short HEAD)
          opts_sha=$(git -C "$GITHUB_WORKSPACE/opts" rev-parse --short HEAD)
          {
            echo "Proton-CachyOS-Deadlock (AIO)"
            echo "Source branch : ${{ steps.ref.outputs.ref }} @ $src_sha"
            echo "Optimizations : ${{ inputs.opts_ref || 'main' }} @ $opts_sha"
            echo "Profile       : $PROFILE"
            echo "Built         : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Applied patches (new on top of source):"
            sed 's/^/  - /' "$GITHUB_WORKSPACE/patches-applied.txt" 2>/dev/null || true
          } > "$dist_dir/BUILD-INFO.txt"
          cp "$GITHUB_WORKSPACE/patch-report.md" "$dist_dir/PATCH-REPORT.md" 2>/dev/null || true

          command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
          mkdir -p "$GITHUB_WORKSPACE/out"
          archive="$GITHUB_WORKSPACE/out/proton-cachyos-deadlock-${PROFILE}-${src_sha}.tar.zst"
          tar -C "$(dirname "$dist_dir")" \
              --transform "s,^$(basename "$dist_dir"),proton-cachyos-deadlock-${PROFILE}," \
              -cf - "$(basename "$dist_dir")" \
            | zstd -T0 -10 -q -o "$archive"
          ls -lh "$GITHUB_WORKSPACE/out"
          echo "archive=$(basename "$archive")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proton-CachyOS-Deadlock-${{ env.PROFILE }}-${{ github.run_number }}
          path: out/*.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
            patch-report.md
            src/build/${{ env.BUILD_NAME }}/*.log
          if-no-files-found: ignore
          retention-days: 7
