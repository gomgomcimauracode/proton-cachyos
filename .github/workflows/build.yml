name: Build Proton-CachyOS-Deadlock (v3)

on:
  workflow_dispatch:
  push:
    branches:
      - cachyos_main
      - cachyos_*_*/main

jobs:
  build-deadlock-proton:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Configure Pacman & Install Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm base-devel git sudo python ninja meson glslang perl-opencc
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout Repository (Submodules Included)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Clone Deadlock Low-Latency Optimizations
        run: |
          git clone https://github.com/itchyfeetleech/deadlock-linux-optimizations.git /tmp/deadlock-opts

      - name: Apply Wine & NTDLL Patches
        run: |
          chown -R builduser:builduser . /tmp/deadlock-opts
          su builduser -c "
            cd wine
            # Soket shm polling yamasi
            patch -p1 < /tmp/deadlock-opts/patches/wine/0003-socket-shm-polling.patch || true
            
            # NTDLL sync fast paths (uyumlu hunk'lar)
            patch -p1 --fuzz=3 < /tmp/deadlock-opts/patches/wine/0002-ntdll-sync-fast-paths.patch || true
            
            # Wineserver protokol yapisi degistigi icin make_requests calistirilmali
            if [ -f tools/make_requests ]; then
              ./tools/make_requests
            fi
          "

      - name: Build Proton x86_64_v3 (Optimized for i5-1145G7)
        run: |
          su builduser -c "
            export CFLAGS='-O3 -march=x86-64-v3 -mtune=core-avx2 -pipe -fno-plt -flto=auto'
            export CXXFLAGS='-O3 -march=x86-64-v3 -mtune=core-avx2 -pipe -fno-plt -flto=auto'
            
            # Tek hedefli ve optimize yapilandirma baslatiliyor
            ./configure --enable-single-make
            make proton
          "

      - name: Prepare Steam Compatibility Tool Structure
        run: |
          su builduser -c "
            # Ciktilari ozel isimle paketlemek icin klasor hazirligi
            DIST_DIR='build/dist'
            if [ -d 'build/proton-cachyos' ]; then
              DIST_DIR='build/proton-cachyos'
            fi
            
            # Steam'de gorunecek ozel ismi ayarlayalim
            if [ -f "\$DIST_DIR/version" ]; then
              echo 'Proton-CachyOS-Deadlock' > "\$DIST_DIR/version"
            fi
          "

      - name: Upload Proton Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proton-CachyOS-Deadlock-x86_64_v3
          path: build/dist/
