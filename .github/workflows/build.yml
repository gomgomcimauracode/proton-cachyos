name: Build Proton-CachyOS-Deadlock (Source)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build'
        required: false
        default: 'cachyos_11.0_20261014/main'
  push:
    branches:
      - cachyos_main
      - cachyos_*_*/main

jobs:
  build-proton-source:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Configure Pacman & Install Proton Build Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm base-devel git sudo python ninja meson glslang zstd \
            autoconf automake libtool ccache make gcc pkgconf patch cmake nasm \
            curl wget rsync unzip \
            mingw-w64-gcc mingw-w64-headers mingw-w64-crt mingw-w64-winpthreads \
            flex bison gettext perl freetype2 fontconfig libgl alsa-lib \
            libx11 libxcursor libxi libxrandr libxxf86vm
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /app/dist && chown -R builduser:builduser /app/dist
          git config --system --add safe.directory '*'

      - name: Checkout Repository (Submodules Included)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Verify Repository Root
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "==> Workspace: $(pwd)"
          echo "==> Branch: $(git branch --show-current || git rev-parse --abbrev-ref HEAD)"
          if [ ! -x ./configure.sh ] || [ ! -f ./Makefile ]; then
            echo "ERROR: configure.sh or Makefile not found in repository root."
            ls -la
            exit 1
          fi

      - name: Clone Optimization Repositories
        run: |
          git clone https://github.com/itchyfeetleech/deadlock-linux-optimizations.git /tmp/deadlock-opts

      - name: Apply All Compatible Low-Latency Patches
        run: |
          cd "$GITHUB_WORKSPACE"
          chown -R builduser:builduser "$GITHUB_WORKSPACE" /tmp/deadlock-opts
          su builduser -c "
            cd '$GITHUB_WORKSPACE'
            if [ -d 'wine' ]; then
              cd wine
              echo '==> Applying Socket SHM Polling Patch...'
              patch -p1 < /tmp/deadlock-opts/patches/wine/0003-socket-shm-polling.patch || true

              echo '==> Applying NTDLL Sync Fast Paths Patch...'
              patch -p1 --fuzz=3 < /tmp/deadlock-opts/patches/wine/0002-ntdll-sync-fast-paths.patch || true

              if [ -f tools/make_requests ]; then
                echo '==> Updating Wineserver Protocol Requests...'
                ./tools/make_requests
              fi
            fi
          "

      - name: Configure and Build Proton from Source (x86_64_v3)
        run: |
          cd "$GITHUB_WORKSPACE"
          chown -R builduser:builduser "$GITHUB_WORKSPACE"
          su builduser -c "
            cd '$GITHUB_WORKSPACE'
            export CFLAGS='-O3 -march=x86-64-v3 -mtune=core-avx2 -pipe -fno-plt -flto=auto'
            export CXXFLAGS='-O3 -march=x86-64-v3 -mtune=core-avx2 -pipe -fno-plt -flto=auto'

            echo '==> Running configure script...'
            ./configure.sh --prefix=/app/dist

            echo '==> Starting parallel compilation...'
            make -j$(nproc)
          "

      - name: Package Compatibility Tool
        run: |
          cd "$GITHUB_WORKSPACE"
          su builduser -c "
            cd '$GITHUB_WORKSPACE'
            make install
          "
          # Paketleme veya çıktıları toplama adımı
          mkdir -p build/dist
          if [ -d "/app/dist" ]; then
            cp -r /app/dist/* build/dist/
          else
            # Eğer dist başka bir yere çıkıyorsa mevcut dizindeki çıktıyı al
            cp -r dist/* build/dist/ 2>/dev/null || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proton-CachyOS-Deadlock-Source-x86_64_v3
          path: build/dist/
