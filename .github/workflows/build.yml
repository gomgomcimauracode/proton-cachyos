name: Build Proton-CachyOS-Deadlock (v3)

on:
  workflow_dispatch:
  push:
    branches:
      - cachyos_main
      - cachyos_*_*/main

jobs:
  build-deadlock-proton:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Configure Pacman & Install Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm base-devel git sudo python ninja meson glslang
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout Repository (Submodules Included)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Clone Optimization Repositories
        run: |
          git clone https://github.com/itchyfeetleech/deadlock-linux-optimizations.git /tmp/deadlock-opts

      - name: Apply All Compatible Low-Latency Patches
        run: |
          chown -R builduser:builduser . /tmp/deadlock-opts
          su builduser -c "
            cd wine
            echo '==> Applying Socket SHM Polling Patch...'
            patch -p1 < /tmp/deadlock-opts/patches/wine/0003-socket-shm-polling.patch || true
            
            echo '==> Applying NTDLL Sync Fast Paths Patch...'
            patch -p1 --fuzz=3 < /tmp/deadlock-opts/patches/wine/0002-ntdll-sync-fast-paths.patch || true
            
            if [ -f tools/make_requests ]; then
              echo '==> Updating Wineserver Protocol Requests...'
              ./tools/make_requests
            fi
          "

      - name: Build Proton x86_64_v3 (Optimized for Tiger Lake / i5-1145G7)
        run: |
          su builduser -c "
            export CFLAGS='-O3 -march=x86-64-v3 -mtune=core-avx2 -pipe -fno-plt -flto=auto'
            export CXXFLAGS='-O3 -march=x86-64-v3 -mtune=core-avx2 -pipe -fno-plt -flto=auto'
            
            ./configure --enable-single-make
            make proton
          "

      - name: Prepare Steam Compatibility Tool Output
        run: |
          su builduser -c "
            TARGET_DIR=''
            if [ -d 'build/proton-cachyos' ]; then
              TARGET_DIR='build/proton-cachyos'
            elif [ -d 'build/dist' ]; then
              TARGET_DIR='build/dist'
            else
              # Fallback to find any directory containing version/proton files
              TARGET_DIR=\$(find build -maxdepth 2 -type d | grep -E 'proton|dist' | head -n 1)
            fi

            echo '==> Using target directory: \$TARGET_DIR'
            if [ -n \"\$TARGET_DIR\" ] && [ -d \"\$TARGET_DIR\" ]; then
              echo 'Proton-CachyOS-Deadlock' > \"\$TARGET_DIR/version\"
            else
              echo 'Warning: Could not locate built Proton directory!'
            fi
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proton-CachyOS-Deadlock-x86_64_v3
          path: |
            build/proton-cachyos/
            build/dist/
